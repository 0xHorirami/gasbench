[package]
name = "gasbench"
version = "0.1.0"
edition = "2021"
description = "Gas benchmarking tool for smart contract functions"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
ethers = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tabled = "0.15"
eyre = "0.6"
colored = "2"
hex = "0.4"

[package]
name = "gasbench"
version = "0.1.0"
edition = "2021"
description = "Gas benchmarking tool for EVM smart contracts"
license = "MIT"
readme = "README.md"
repository = "https://github.com/0xHorirami/gasbench"

[dependencies]
clap = { version = "4", features = ["derive"] }
ethers = { version = "2", features = ["abigen"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tabled = "0.15"
anyhow = "1"
